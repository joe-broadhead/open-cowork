# Standalone Wiki product release (JOE-912). Does not build Electron/Desktop.
name: Release Wiki

on:
  workflow_dispatch:
  push:
    tags:
      - 'wiki@v*'
      - 'wiki-v*'

permissions:
  contents: read

concurrency:
  group: release-wiki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: products/wiki/docs/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wiki docs dependencies
        run: python -m pip install -r products/wiki/docs/requirements.txt

      - name: Product boundaries
        run: pnpm boundaries:check

      - name: Lint Wiki workspace
        run: pnpm --filter cowork-wiki-workspace lint

      - name: Check generated reference docs
        run: pnpm --filter cowork-wiki-workspace docs:reference -- --check

      - name: Build Wiki docs (strict)
        run: pnpm --filter cowork-wiki-workspace docs:build

      - name: Test
        run: pnpm --filter cowork-wiki-workspace test

      - name: Pack CLI
        run: pnpm --filter cowork-wiki-workspace pack:cli

      - name: Verify release ref and packed CLI
        id: wiki-pack
        shell: bash
        run: |
          release_ref="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            release_ref="manual"
          fi
          node products/wiki/scripts/verify-release-artifact.mjs "$release_ref" products/wiki/artifacts/npm >> "$GITHUB_OUTPUT"

      - name: Standalone smoke
        run: node products/wiki/scripts/standalone-smoke.mjs "${{ steps.wiki-pack.outputs.tarball }}"

      - name: Stage artifacts
        run: |
          mkdir -p artifacts/wiki
          cp -- "${{ steps.wiki-pack.outputs.tarball }}" artifacts/wiki/
          cd artifacts/wiki
          shasum -a 256 ./*.tgz | tee SHA256SUMS

      - name: Upload pack artifact
        uses: actions/upload-artifact@v7
        with:
          name: cowork-wiki-pack
          path: artifacts/wiki/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_PRERELEASE: ${{ steps.wiki-pack.outputs.prerelease }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease_args=()
          case "$WIKI_PRERELEASE" in
            true) prerelease_args=(--prerelease) ;;
            false) ;;
            *)
              echo "::error::Unexpected Wiki prerelease classification: $WIKI_PRERELEASE"
              exit 1
              ;;
          esac
          gh release create "$tag" \
            --title "Wiki ${tag}" \
            --notes "Standalone Wiki CLI pack from monorepo products/wiki. Does not include Desktop." \
            --verify-tag \
            "${prerelease_args[@]}" \
            artifacts/wiki/*
