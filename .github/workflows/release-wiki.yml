# Standalone Wiki product release (JOE-912). Does not build Electron/Desktop.
name: Release Wiki

on:
  workflow_dispatch:
  push:
    tags:
      - 'wiki@v*'
      - 'wiki-v*'

permissions:
  contents: read

concurrency:
  group: release-wiki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: products/wiki/docs/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wiki docs dependencies
        run: python -m pip install -r products/wiki/docs/requirements.txt

      - name: Product boundaries
        run: pnpm boundaries:check

      - name: Lint Wiki workspace
        run: pnpm --filter cowork-wiki-workspace lint

      - name: Check generated reference docs
        run: pnpm --filter cowork-wiki-workspace docs:reference -- --check

      - name: Build Wiki docs (strict)
        run: pnpm --filter cowork-wiki-workspace docs:build

      - name: Test
        run: pnpm --filter cowork-wiki-workspace test

      - name: Pack CLI
        run: pnpm --filter cowork-wiki-workspace pack:cli

      - name: Resolve packed CLI
        id: wiki-pack
        shell: bash
        run: |
          mapfile -t tarballs < <(find products/wiki/artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print)
          if (( ${#tarballs[@]} != 1 )); then
            echo "::error::Expected exactly one packed Wiki CLI tarball; found ${#tarballs[@]}."
            exit 1
          fi
          printf 'tarball=%s\n' "${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Standalone smoke
        run: node products/wiki/scripts/standalone-smoke.mjs "${{ steps.wiki-pack.outputs.tarball }}"

      - name: Stage artifacts
        run: |
          mkdir -p artifacts/wiki
          cp -- "${{ steps.wiki-pack.outputs.tarball }}" artifacts/wiki/
          cd artifacts/wiki
          shasum -a 256 ./*.tgz | tee SHA256SUMS

      - name: Upload pack artifact
        uses: actions/upload-artifact@v7
        with:
          name: cowork-wiki-pack
          path: artifacts/wiki/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "Wiki ${tag}" \
            --notes "Standalone Wiki CLI pack from monorepo products/wiki. Does not include Desktop." \
            --verify-tag \
            artifacts/wiki/* || \
          gh release upload "$tag" artifacts/wiki/* --clobber
