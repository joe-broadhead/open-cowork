name: Monthly UI Evals

# Monthly, real-Electron UI eval flows. These are heavier than the PR-gate
# smoke suite (they drive full user journeys and capture visual evidence), so
# they run on a schedule instead of on every push. Monthly cadence controls
# GitHub Actions cost while workflow_dispatch keeps ad-hoc runs available. Job
# names are intentionally NOT part
# of the required-checks set enforced by scripts/verify-release-checks.mjs.

on:
  schedule:
    # 06:17 UTC on the 1st of each month (once per month).
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Update visual-regression baselines (upload for review)'
        type: boolean
        default: false

permissions:
  contents: read
  # JOE-926: open/comment GitHub issues on consecutive eval failures.
  issues: write
  actions: read

env:
  TZ: UTC
  # Consecutive completed failures before opening/commenting an alert issue.
  # Silence: close the auto-opened issue after a green run or accepted risk.
  OPEN_COWORK_EVAL_FAIL_STREAK: '2'

concurrency:
  group: monthly-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs every apps/desktop/tests/*.eval.test.ts flow on a virtual display.
      # Each flow captures screenshot evidence under
      # apps/desktop/test-artifacts/evals/<flow>/, and the visual-regression
      # flow checks Home across Mercury density/scheme combinations, Team, and
      # Home, Projects, and Knowledge at 800/1024/1440px against committed
      # baselines. Missing baselines fail unless an explicit update run writes
      # them for review.
      #
      # Contract selectors (keep dual-updated if UI renames):
      #   - Admin nav: [data-nav-view="admin"]  (Sidebar ADMIN_NAV_ITEM)
      #   - Approvals nav: [data-nav-view="approvals"]
      - name: Run monthly UI eval flows + visual regression (xvfb)
        id: evals
        run: xvfb-run -a pnpm test:e2e:evals
        env:
          OPEN_COWORK_EVAL_UPDATE_BASELINES: ${{ inputs.update_baselines && '1' || '0' }}

      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-eval-evidence
          path: apps/desktop/test-artifacts/evals/**
          if-no-files-found: warn
          retention-days: 30

      # Explicit update runs write visual baselines into the tree but do not
      # commit them. Upload the complete set for maintainer review.
      - name: Upload visual baselines
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-eval-visual-baselines
          path: apps/desktop/tests/visual-baselines/**
          if-no-files-found: ignore
          retention-days: 30

      # JOE-926: non-blocking quality signal — monthly evals are not a required
      # release check, so open a GitHub issue after N consecutive red runs.
      - name: Alert on consecutive monthly eval failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/monthly-eval-failure-alert.mjs
