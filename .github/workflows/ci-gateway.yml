name: CI Gateway

on:
  pull_request:
    paths:
      - 'products/gateway/**'
      - 'packages/shared/**'
      - 'packages/gateway-channel/**'
      - 'packages/gateway-provider-telegram/**'
      - 'packages/gateway-provider-discord/**'
      - 'packages/gateway-provider-whatsapp/**'
      - 'packages/gateway-provider-webhook/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-gateway.yml'
      - 'scripts/check-product-boundaries.mjs'
  push:
    branches: [master]
    paths:
      - 'products/gateway/**'
      - 'packages/shared/**'
      - 'packages/gateway-channel/**'
      - 'packages/gateway-provider-telegram/**'
      - 'packages/gateway-provider-discord/**'
      - 'packages/gateway-provider-whatsapp/**'
      - 'packages/gateway-provider-webhook/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-gateway.yml'

concurrency:
  group: ci-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Product boundaries
        run: pnpm boundaries:check

      # products/gateway consumes dist-only workspace package exports.
      - name: Build Gateway dependency closure
        run: pnpm --filter "cowork-gateway..." run build

      - name: Typecheck Gateway
        run: pnpm --filter cowork-gateway typecheck

      - name: Test Gateway
        run: pnpm --filter cowork-gateway test

      - name: Release check (if present)
        run: pnpm --filter cowork-gateway release:check

      - name: Standalone install smoke
        run: node products/gateway/scripts/standalone-smoke.mjs
