<!doctype html>
<html lang="en" data-color-scheme="system" data-ui-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Cowork</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        /* STARTUP_THEME_BEGIN */
        color-scheme: light dark;
        --color-base: Canvas;
        --color-surface: Canvas;
        --color-text: CanvasText;
        --color-text-secondary: GrayText;
        --color-accent-2: AccentColor;
        --shadow-card: none;
        /* STARTUP_THEME_END */
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, color-mix(in srgb, var(--color-accent-2, AccentColor) 14%, transparent), transparent 36%), var(--color-base, Canvas);
        color: var(--color-text, CanvasText);
      }

      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .badge {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: var(--color-surface, Canvas);
        border: 1px solid color-mix(in srgb, var(--color-accent-2, AccentColor) 32%, transparent);
        box-shadow: var(--shadow-card, none);
        font-size: 34px;
        font-weight: 700;
        color: var(--color-accent-2, AccentColor);
      }

      .title {
        font-size: 28px;
        font-weight: 600;
      }

      .subtitle {
        font-size: 14px;
        color: var(--color-text-secondary, GrayText);
      }
    </style>
  </head>
  <body data-startup-surface="splash">
    <div class="shell" aria-label="Open Cowork is starting">
      <div class="badge">O</div>
      <div class="title">Open Cowork</div>
      <div class="subtitle">Starting runtime and loading workspace...</div>
    </div>
  </body>
</html>
